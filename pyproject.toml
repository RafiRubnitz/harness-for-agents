[project]
name = "harness"
version = "0.1.0"
description = "Local multi-agent harness: model gateway, tools, memory, hooks, and a desktop GUI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "loguru>=0.7",
    "python-ulid>=2.7",
    "ruamel.yaml>=0.18",
    "keyring>=25",
    "httpx>=0.27",
    "httpx2>=2.0",
    "anthropic>=0.40",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "send2trash>=2.1.0",
    "customtkinter>=6.0.0",
    "python-bidi>=0.6.11",
    "markdown-it-py>=4.2.0",
    "pillow>=12.3.0",
    "openai>=1.50",
    "lancedb>=0.20",
    "tzdata>=2026.5",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "mcp>=2.3.0",
]

[project.scripts]
harness = "harness.app:main"

[project.optional-dependencies]
embedder = [
    "flagembedding>=1.4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "pytest-timeout>=2.3",
    "syrupy>=4.6",
    "respx>=0.21",
    "import-linter>=2.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "ASYNC", "SIM", "RUF", "PL", "PT", "TRY", "S", "T20"]
ignore = ["PLR0913", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
# Tests poll agent tasks and inspect files directly.
"tests/**" = ["S101", "S105", "PLR2004", "RUF001", "RUF003", "ASYNC110", "ASYNC240"]
"src/harness/memory/**" = ["RUF001", "RUF002", "RUF003"]
# Startup-only file checks, before the loop serves anything.
"src/harness/memory/db/migrate.py" = ["ASYNC240", "RUF001", "RUF002", "RUF003"]
"src/harness/**/consts.py" = ["S105"]
# Symbols of the interface (prompt arrow, bullets) and Hebrew examples.
"src/harness/gui/**" = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --allow-hosts=127.0.0.1,::1"
timeout = 10
markers = [
    "unit: fast, isolated",
    "integration: several components together",
    "live: real providers / network, manual only",
    "slow: over 1 second",
    "acceptance(ref): implements an acceptance criterion from the spec",
]

[tool.coverage.run]
branch = true
source = ["harness"]
omit = ["src/harness/gui/widgets/*", "src/harness/app.py"]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_package = "harness"

[[tool.importlinter.contracts]]
name = "core imports no component"
type = "forbidden"
source_modules = ["harness.core"]
forbidden_modules = [
    "harness.agents",
    "harness.app",
    "harness.cli",
    "harness.config",
    "harness.context",
    "harness.dispatcher",
    "harness.embedder_server",
    "harness.gui",
    "harness.hooks",
    "harness.memory",
    "harness.models",
    "harness.tools",
]

[[tool.importlinter.contracts]]
name = "the front ends talk to the core only through harness.core"
type = "forbidden"
source_modules = ["harness.cli", "harness.gui"]
forbidden_modules = [
    "harness.agents",
    "harness.app",
    "harness.config",
    "harness.context",
    "harness.dispatcher",
    "harness.embedder_server",
    "harness.hooks",
    "harness.memory",
    "harness.models",
    "harness.tools",
]

[[tool.importlinter.contracts]]
name = "components do not import the composition root or the front ends"
type = "forbidden"
source_modules = [
    "harness.agents",
    "harness.config",
    "harness.context",
    "harness.embedder_server",
    "harness.hooks",
    "harness.memory",
    "harness.models",
    "harness.tools",
]
forbidden_modules = ["harness.app", "harness.cli", "harness.dispatcher", "harness.gui"]

[[tool.importlinter.contracts]]
name = "the embeddings server is a separate process that shares only harness.core"
type = "forbidden"
source_modules = ["harness.embedder_server"]
forbidden_modules = [
    "harness.agents",
    "harness.config",
    "harness.context",
    "harness.hooks",
    "harness.memory",
    "harness.models",
    "harness.tools",
]
