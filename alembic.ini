# Developer use only (`uv run alembic revision ...`). The app builds its Alembic config in
# code (harness/memory/db/migrate.py) and never reads this file.
# The database is the one under HARNESS_HOME (default ~/.harness).

[alembic]
script_location = src/harness/memory/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
