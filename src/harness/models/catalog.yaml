# Built-in model catalog: provider + id -> limits, capabilities, prices (USD per million tokens).
#
# NOTE: context windows, output limits and prices below are best-effort estimates and are
# NOT verified against the providers' current price lists. Override any entry with
# `models.<alias>.profile` in config.yaml (same fields).
models:
  - provider: anthropic
    id: claude-opus-5-5
    context_window: 200000
    max_output_tokens: 32000
    capabilities:
      { tools: true, images: true, files: true, thinking: true, json_schema: true, prompt_cache: explicit }
    prices: { input: 5.0, output: 25.0, cache_read: 0.5, cache_write: 6.25 }

  - provider: anthropic
    id: claude-sonnet-5-5
    context_window: 200000
    max_output_tokens: 32000
    capabilities:
      { tools: true, images: true, files: true, thinking: true, json_schema: true, prompt_cache: explicit }
    prices: { input: 3.0, output: 15.0, cache_read: 0.3, cache_write: 3.75 }

  - provider: anthropic
    id: claude-haiku-5-5
    context_window: 200000
    max_output_tokens: 16000
    capabilities:
      { tools: true, images: true, files: true, thinking: true, json_schema: true, prompt_cache: explicit }
    prices: { input: 1.0, output: 5.0, cache_read: 0.1, cache_write: 1.25 }

  - provider: openai
    id: gpt-5
    context_window: 400000
    max_output_tokens: 128000
    capabilities:
      { tools: true, images: true, files: true, thinking: true, json_schema: true, prompt_cache: auto }
    prices: { input: 1.25, output: 10.0, cache_read: 0.125, cache_write: 0.0 }

  - provider: openai
    id: gpt-5-mini
    context_window: 400000
    max_output_tokens: 128000
    capabilities:
      { tools: true, images: true, files: true, thinking: true, json_schema: true, prompt_cache: auto }
    prices: { input: 0.25, output: 2.0, cache_read: 0.025, cache_write: 0.0 }

  - provider: openai
    id: gpt-4.1
    context_window: 1000000
    max_output_tokens: 32000
    capabilities:
      { tools: true, images: true, files: true, thinking: false, json_schema: true, prompt_cache: auto }
    prices: { input: 2.0, output: 8.0, cache_read: 0.5, cache_write: 0.0 }

  - provider: deepseek
    id: deepseek-chat
    context_window: 128000
    max_output_tokens: 8000
    capabilities:
      { tools: true, images: false, files: false, thinking: false, json_schema: false, prompt_cache: auto }
    prices: { input: 0.28, output: 0.42, cache_read: 0.028, cache_write: 0.0 }

  - provider: deepseek
